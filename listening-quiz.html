   GitHub Pages, salta a nis.cohasset.pe conservando ruta, query y hash. */

<!-- Auto-version: always load the latest deployed version without clearing cache. -->
<script>
(function(){
  try{
    var params = new URLSearchParams(location.search);
    var loadedV = params.get('v');
    fetch('version.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(data){
        if(!data || !data.version) return;
        if(loadedV !== data.version){
          params.set('v', data.version);
          location.replace(location.pathname + '?' + params.toString() + location.hash);
        }
      })
      .catch(function(){});
  }catch(e){}
})();
</script>

/* Foco de teclado: se apaga el marco del navegador en varios sitios de esta

   ve donde esta. */

<script>
/* ---------- vocabulario del examen (solo en RESULTADOS) ----------
   Durante el examen no hay diccionario a proposito: el anti-cheat llega a
   bloquear el traductor, y tener significados a mano falsearia la practica.
   Al terminar es al reves: repasar las palabras que salieron es la parte que
   deja aprendizaje. Salen del lexico propio, con fonetica y audio. */
window.examVocabHtml = function(fuente, max){
  var V = window.EXAM_VOCAB || {};
  var txt = (typeof fuente === 'string') ? fuente : JSON.stringify(fuente || '');
  var vistas = {}, orden = [];
  (txt.match(/[A-Za-z][a-z']{2,}/g) || []).forEach(function(w){
    var k = w.toLowerCase();
    if(V[k] && !vistas[k]){ vistas[k] = 1; orden.push(k); }
  });
  if(!orden.length) return '';
  /* Se muestran primero las mas avanzadas del examen. Ordenadas alfabeticamente
     salian siempre las mismas del principio ('abroad', 'accept'), que no son las
     que cuestan. A igual nivel, la palabra mas larga primero. */
  var NIV = {'C2':6,'C1':5,'B2':4,'B1':3,'A2':2,'A1':1,'pre-A1':0};
  var tope = max || 40;
  var lista = orden.sort(function(x,y){
    var nx = NIV[(V[x].c)||''] , ny = NIV[(V[y].c)||''];
    nx = (nx === undefined ? 3.5 : nx); ny = (ny === undefined ? 3.5 : ny);
    return ny - nx || y.length - x.length || (x < y ? -1 : 1);
  }).slice(0, tope);
  var filas = lista.map(function(w){
    var e = V[w];
    var ip = e.uk || e.us || '';
    var boton = '';
    if(e.a){
      var f = (e.a === 1) ? w.replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') : e.a;
      boton = '<button type="button" class="ev-say" data-f="' + f + '" title="Listen">&#128266;</button>';
    }
    return '<div class="ev-row"><div><b>' + w + '</b> ' +
           (ip ? '<span class="ev-ipa">' + ip + '</span>' : '') +
           '<div class="ev-def">' + e.d + '</div></div>' + boton + '</div>';
  }).join('');
  var mas = orden.length > tope ? '<p class="ev-more">and ' + (orden.length - tope) + ' more from this exam</p>' : '';
  return '<div class="card ev-card"><h2>Vocabulary from this exam</h2>' +
    '<p class="ev-sub">Words from this exam that you study in your courses. Tap the speaker to hear them.</p>' +
    '<div class="ev-list">' + filas + '</div>' + mas + '</div>';
};
document.addEventListener('click', function(ev){
  var b = ev.target && ev.target.closest && ev.target.closest('.ev-say');
  if(!b) return;
  ev.preventDefault();
  var a = new Audio((window.LEX_AUDIO || '/lexicon-audio/') + 'uk/' + b.dataset.f + '.mp3');
  a.play().catch(function(){});
});
</script>
