<!doctype html>

<head>
<meta charset="utf-8">
<script>
/* Los alumnos no deben ver github.io en la barra (y alli los intentos no se
   guardan por el localStorage de otro origen): si esta copia se abre desde
   GitHub Pages, salta a nis.cohasset.pe conservando ruta, query y hash. */
if(/\.github\.io$/i.test(location.hostname)){
  location.replace('https://nis.cohasset.pe'+location.pathname+location.search+location.hash);
}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Auto-version: always load the latest deployed version without clearing cache. -->
<script>
(function(){
  try{
    var params = new URLSearchParams(location.search);
    var loadedV = params.get('v');
    fetch('version.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(data){
        if(!data || !data.version) return;
        if(loadedV !== data.version){
          params.set('v', data.version);
          location.replace(location.pathname + '?' + params.toString() + location.hash);
        }
      })
      .catch(function(){});
  }catch(e){}
})();
</script>

<style>
  :root{--accent:#4987c6;--accent2:#2f6aa8;--line:#cbd5e1;--soft:#d1d2ea;--warn:#f59e0b;--bg:#f1f5f9}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Gotham',"Montserrat","Segoe UI",sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
  button{font-family:inherit}
  input,select,textarea{font-family:inherit;font-size:1rem;touch-action:manipulation;-webkit-user-select:text;user-select:text;-webkit-tap-highlight-color:rgba(73,135,198,.18)}
  .app{max-width:1100px;margin:0 auto;padding:18px}
  /* Welcome / level */
  .hero{max-width:560px;margin:5vh auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;text-align:center;box-shadow:0 10px 40px rgba(15,23,42,.06)}
  .hero img{height:54px;width:auto;margin-bottom:8px}
  .hero h1{margin:6px 0 2px;font-size:1.6rem}
  .hero .sub{color:var(--muted);margin:0 0 18px}
  .field{text-align:left;margin:10px 0}
  .field label{display:block;font-weight:600;font-size:.85rem;margin-bottom:4px}
  .field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}
  .btn{background:var(--accent);color:var(--card);border:none;padding:12px 22px;border-radius:10px;font-weight:700;cursor:pointer;font-size:1rem}
  .btn:hover{filter:brightness(.97)}
  .btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--accent)}
  .levels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:8px}
  .level-card{border:1px solid var(--line);border-radius:14px;padding:18px 12px;cursor:pointer;background:var(--card);text-align:center;transition:.15s}
  .level-card:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
  .level-card .lv{font-size:1.5rem;font-weight:800;color:var(--accent)}
  .level-card .nm{font-size:.82rem;color:var(--muted)}
  /* Inspera-style shell */
  .shell{height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--card)}
  /* ---- Anti-cheat overlay (tab-switch warning) — must sit above the exam shell ---- */
  #acOverlay{position:fixed!important;inset:0!important;z-index:99999!important}
  /* ---- Anti-cheat: iOS/iPad hardening ----
     Block the long-press callout (Translate / Look Up / Copy) and selection
     on the prompt/instructions — the desktop `contextmenu` block does NOT fire
     on iOS Safari long-press. The answer textarea stays fully editable. */
  /* DESACTIVADO (2026-08-20) junto con el kill switch AC_DISABLED — quitar
     los comentarios para reactivar:
  .shell{-webkit-touch-callout:none; -webkit-user-select:none; user-select:none}
  .shell input,
  .shell textarea,
  .shell select,
  .shell [contenteditable]{-webkit-touch-callout:default; -webkit-user-select:text; user-select:text}
  */
  .hdr{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card)}
  .hdr .brand img{height:34px;width:auto}
  .hdr .cand{font-size:.9rem;color:var(--muted)}
  .hdr .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .timer{font-family:Consolas,monospace;font-weight:800;color:var(--accent);background:var(--soft);padding:6px 14px;border-radius:8px;letter-spacing:2px}
  .timer.over{color:var(--card);background:var(--bad);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.65}}
  .hdr button{background:var(--card);color:var(--muted);border:1px solid var(--line);padding:7px 14px;border-radius:8px;font-weight:600;cursor:pointer}
  .hdr button.fin{background:var(--accent);color:var(--card);border-color:var(--accent)}
  .main{flex:1 1 auto;min-height:0;overflow-y:auto;padding:18px 22px 26px}
  .instr{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:8px 0 14px}
  .instr strong{display:block;font-size:1rem;margin-bottom:4px}
  .instr p{margin:0;color:var(--muted);font-size:.92rem}
  .pane{display:none}
  .pane.active{display:block}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .two-col .left{padding:20px 22px;border-right:1px solid var(--line);background:var(--card)}
  .two-col .right{padding:20px 22px;background:var(--bg)}
  @media(max-width:820px){.two-col{grid-template-columns:1fr}.two-col .left{border-right:none;border-bottom:1px solid var(--line)}}
  .task-lead{margin:0 0 12px;color:var(--ink)}
  .stim{border:1px solid #94a3b8;border-radius:8px;padding:14px 16px;background:var(--card);white-space:pre-wrap;line-height:1.55;margin:8px 0}
  .stim .stim-title{font-weight:800;text-align:center;margin-bottom:8px}
  .stim .stim-head{background:#475569;color:var(--card);font-weight:700;letter-spacing:1px;padding:5px 12px;border-radius:6px 6px 0 0;margin:-14px -16px 12px}
  .notes-title{font-weight:700;margin:10px 0 4px}
  .write-it{font-weight:700;margin-top:12px}
  textarea.box{width:100%;min-height:340px;resize:vertical;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:1rem;line-height:1.6}
  textarea.box:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
  .wc{text-align:right;font-size:.85rem;color:var(--muted);margin-top:6px}
  .choose{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:.92rem}
  .choose select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;margin-left:auto}
  .choose .pick{font-weight:700}
  .choose .pick.on{color:var(--good)}
  /* footer nav */
  .ftr{flex:0 0 auto;display:flex;align-items:stretch;gap:8px;border-top:1px solid var(--line);padding:8px 14px;background:var(--card);overflow-x:auto}
  .tabs{display:flex;gap:6px;flex:1}
  .tab{padding:8px 16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;min-width:90px;text-align:center;flex-shrink:0;display:flex;flex-direction:column;gap:3px}
  .tab .tn{font-weight:700;font-size:.85rem}
  .tab .ts{font-size:.76rem;color:var(--muted)}
  .tab.active{background:var(--card);border-color:var(--accent);box-shadow:0 0 0 2px var(--soft);color:var(--accent)}
  .tab .opts{display:none;gap:4px;justify-content:center}
  .tab.active .opts{display:flex}
  .tab.active .ts{display:none}
  .onum{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--muted);font-size:.78rem;font-weight:700;cursor:pointer}
  .onum.cur{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 2px var(--soft)}
  .onum.done{background:var(--accent);border-color:var(--accent);color:var(--card)}
  .arrows{display:flex;gap:6px;align-items:center;padding-left:8px;border-left:1px solid var(--line)}
  .arrows button{background:var(--accent);color:var(--card);border:none;padding:9px 16px;border-radius:8px;font-weight:700;cursor:pointer;min-width:46px}
  .arrows button:disabled{background:var(--line);cursor:not-allowed}
  /* results */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
  .card h2{margin:0 0 8px;font-size:1.15rem}
  .score-card{text-align:center;padding:22px}
  .score-card .big{font-size:2.4rem;font-weight:800}
  .score-card .pct{font-size:1.3rem;color:var(--accent);font-weight:700}
  .band-badge{background:var(--accent);color:var(--card);padding:3px 12px;border-radius:20px;font-weight:700;font-size:.9rem}
  .crit-row{display:flex;gap:10px;align-items:baseline;padding:3px 0;font-size:.9rem}
  .crit-row .nm{min-width:104px;font-weight:600}
  .crit-row .sc{color:var(--accent);font-weight:700;min-width:36px}
  .crit-row .nt{color:var(--muted)}
  .fb{margin-top:10px;background:var(--bg);border-left:3px solid var(--accent);padding:8px 12px;border-radius:6px;font-size:.9rem}
  .answer{margin-top:8px;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:.95rem;line-height:1.6;color:var(--ink)}
  .pdf-actions{display:flex;gap:10px;margin:14px 0}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .topbar img{height:40px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  a.link{color:var(--accent);text-decoration:none;font-weight:600}

/* Foco de teclado: se apaga el marco del navegador en varios sitios de esta
   pagina, asi que aqui se pone uno propio; sin el, quien navega con Tab no
   ve donde esta. */
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
</style>
