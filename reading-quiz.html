<meta charset="UTF-8">
<script>
/* Los alumnos no deben ver github.io en la barra (y alli los intentos no se
   guardan por el localStorage de otro origen): si esta copia se abre desde
   GitHub Pages, salta a nis.cohasset.pe conservando ruta, query y hash. */
if(/\.github\.io$/i.test(location.hostname)){
  location.replace('https://nis.cohasset.pe'+location.pathname+location.search+location.hash);
}
</script>

<!-- Auto-version: always load the latest deployed version without the student
     having to clear the browser cache. On load we read version.json (never
     cached) and, if the page's ?v= does not match, reload pointing at the
     current version — a fresh URL the browser cannot have cached. -->
<script>
(function(){
  try{
    var params = new URLSearchParams(location.search);
    var loadedV = params.get('v');
    fetch('version.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(data){
        if(!data || !data.version) return;
        if(loadedV !== data.version){
          params.set('v', data.version);
          location.replace(location.pathname + '?' + params.toString() + location.hash);
        }
      })
      .catch(function(){ /* offline or no version.json — just use the cached page */ });
  }catch(e){}
})();
</script>

  /* Picture-story (Part 7): three drawings in a row above the writing box */

  /* MC radio cards in light theme */
  .inspera-content .q{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:12px 0;font-family:"Montserrat","Segoe UI",sans-serif}

<!-- EXAM_VOCAB: vocabulario del examen, del lexico propio -->
<script src="reading-quiz.exam-vocab.js?v=0a958033"></script>
<style>
.ev-card .ev-sub{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.ev-list{display:grid;gap:8px}
.ev-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;
        background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ev-ipa{font-family:ui-monospace,Consolas,monospace;color:var(--muted);font-size:.85rem;margin-left:6px}
.ev-def{color:var(--muted);font-size:.88rem;margin-top:2px}
.ev-say{background:var(--card);border:1px solid var(--line);border-radius:8px;cursor:pointer;
        font-size:1rem;padding:4px 9px;line-height:1.2}
.ev-say:hover{background:var(--line)}
.ev-more{color:var(--muted);font-size:.85rem;margin:8px 0 0}

/* Foco de teclado: se apaga el marco del navegador en varios sitios de esta
   pagina, asi que aqui se pone uno propio; sin el, quien navega con Tab no
   ve donde esta. */
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
</style>
<script>
/* ---------- vocabulario del examen (solo en RESULTADOS) ----------
   Durante el examen no hay diccionario a proposito: el anti-cheat llega a
   bloquear el traductor, y tener significados a mano falsearia la practica.
   Al terminar es al reves: repasar las palabras que salieron es la parte que
   deja aprendizaje. Salen del lexico propio, con fonetica y audio. */
window.examVocabHtml = function(fuente, max){
  var V = window.EXAM_VOCAB || {};
  var txt = (typeof fuente === 'string') ? fuente : JSON.stringify(fuente || '');
  var vistas = {}, orden = [];
  (txt.match(/[A-Za-z][a-z']{2,}/g) || []).forEach(function(w){
    var k = w.toLowerCase();
    if(V[k] && !vistas[k]){ vistas[k] = 1; orden.push(k); }
  });
  if(!orden.length) return '';
  /* Se muestran primero las mas avanzadas del examen. Ordenadas alfabeticamente
     salian siempre las mismas del principio ('abroad', 'accept'), que no son las
     que cuestan. A igual nivel, la palabra mas larga primero. */
  var NIV = {'C2':6,'C1':5,'B2':4,'B1':3,'A2':2,'A1':1,'pre-A1':0};
  var tope = max || 40;
  var lista = orden.sort(function(x,y){
    var nx = NIV[(V[x].c)||''] , ny = NIV[(V[y].c)||''];
    nx = (nx === undefined ? 3.5 : nx); ny = (ny === undefined ? 3.5 : ny);
    return ny - nx || y.length - x.length || (x < y ? -1 : 1);
  }).slice(0, tope);
  var filas = lista.map(function(w){
    var e = V[w];
    var ip = e.uk || e.us || '';
    var boton = '';
    if(e.a){
      var f = (e.a === 1) ? w.replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') : e.a;
      boton = '<button type="button" class="ev-say" data-f="' + f + '" title="Listen">&#128266;</button>';
    }
    return '<div class="ev-row"><div><b>' + w + '</b> ' +
           (ip ? '<span class="ev-ipa">' + ip + '</span>' : '') +
           '<div class="ev-def">' + e.d + '</div></div>' + boton + '</div>';
  }).join('');
  var mas = orden.length > tope ? '<p class="ev-more">and ' + (orden.length - tope) + ' more from this exam</p>' : '';
  return '<div class="card ev-card"><h2>Vocabulary from this exam</h2>' +
    '<p class="ev-sub">Words from this exam that you study in your courses. Tap the speaker to hear them.</p>' +
    '<div class="ev-list">' + filas + '</div>' + mas + '</div>';
};
document.addEventListener('click', function(ev){
  var b = ev.target && ev.target.closest && ev.target.closest('.ev-say');
  if(!b) return;
  ev.preventDefault();
  var a = new Audio((window.LEX_AUDIO || '/lexicon-audio/') + 'uk/' + b.dataset.f + '.mp3');
  a.play().catch(function(){});
});
</script>
